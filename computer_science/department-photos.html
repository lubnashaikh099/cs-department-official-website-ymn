<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Photos</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
        }

        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 35px;
        }

        .gallery {
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .gallery a {
            display: block;
        }

        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
            display: block;
        }

        .gallery img:hover {
            transform: scale(1.02);
        }
    </style>
</head>

<body>

<div class="gallery">

    <a href="department photos/dept1.jpg" target="_blank">
        <img src="department photos/dept1.jpg" alt="Department Photo 1">
    </a>

    <a href="department photos/dept2.jpg" target="_blank">
        <img src="department photos/dept2.jpg" alt="Department Photo 2">
    </a>

    <a href="department photos/dept3.jpg" target="_blank">
        <img src="department photos/dept3.jpg" alt="Department Photo 3">
    </a>

    <a href="department photos/dept4.jpg" target="_blank">
        <img src="department photos/dept4.jpg" alt="Department Photo 4">
    </a>

    <a href="department photos/dept5.jpg" target="_blank">
        <img src="department photos/dept5.jpg" alt="Department Photo 5">
    </a>

    <a href="department photos/dept6.jpg" target="_blank">
        <img src="department photos/dept6.jpg" alt="Department Photo 6">
    </a>

</div>
</body>
</html>
